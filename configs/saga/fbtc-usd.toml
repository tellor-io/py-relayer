# FBTC/USD Price Feed Configuration for Saga
extends = ["saga-shared"]

[env]
FEED_NAME = "FBTC/USD"
COINGECKO_ID = "ignition-fbtc"

[commands.relay-threshold]
query_string = "SpotPrice(fbtc,usd)"
price_threshold = 0.02  # 2% threshold for FBTC
offset = 20
price_api_url = "https://api.coingecko.com/api/v3/simple/price?ids=ignition-fbtc&vs_currencies=usd"
