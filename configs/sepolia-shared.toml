# Shared configuration for all sepolia feeds
[env]
DATA_BRIDGE_ADDRESS = "0xc6760FD47FbB799619F3fD5BD79929d330628506"  # data bridge sepolia
TOKEN_BRIDGE_ADDRESS = "0x55355157703A44f7516FBB831333317E98944e32"  # token bridge V2 sepolia
TOKEN_BRIDGE_LEGACY_ADDRESS = "0x62733e63499a25E35844c91275d4c3bdb159D29d"  # optional: token bridge V1, used by relay-bridge --legacy
LAYER_USER_ADDRESS = "0x3d3263d0c2637ea55dea4110edd4f2cf3102f613"   # TellorDataBank sepolia
LAYER_TX_CREATOR_ADDRESS = "${LAYER_TX_CREATOR_ADDRESS_1}"  # Your Layer address
PRICE_SOURCE = "telliot-feeds"

# Chain endpoints
LAYER_SWAGGER_ENDPOINT = "https://node-palmito.tellorlayer.com"
LAYER_RPC_ENDPOINT = "https://node-palmito.tellorlayer.com/rpc"
EVM_NETWORK = "sepolia"

# CoinGecko API base configuration
COINGECKO_BASE_URL = "https://api.coingecko.com/api/v3/simple/price"
PRICE_CURRENCY = "usd"

# Price service
PRICE_SERVICE_URL = "http://127.0.0.1:8787"
PRICE_AGGREGATION = "median"
PRICE_SERVICE_CONFIG = "configs/price-service.toml"

[commands.relay-threshold]
# threshold relayer settings
sleep_time = 14400              # 4 hour heartbeat
check_interval = 600
optimistic_delay = 43200        # 12 hours
max_attestation_age = 600       # 10 minutes
max_data_age = 86400           # 24 hours
min_stake_percentage = 33
price_threshold = 0.02         # 2% default threshold
offset = 0
