[server]
host = "127.0.0.1"
port = 8787
cache_ttl_secs = 10

[providers.coingecko]
enabled = true
base_url = "https://api.coingecko.com/api/v3/simple/price"
rpm = 50

[providers.coinmarketcap]
enabled = false
base_url = "https://pro-api.coinmarketcap.com/v2/cryptocurrency/quotes/latest"
api_key = "${CMC_API_KEY}"
rpm = 30

[providers.coinpaprika]
enabled = true
base_url = "https://api.coinpaprika.com/v1"
rpm = 30

[providers.coinbase]
enabled = true
base_url = "https://api.coinbase.com/v2"
rpm = 60

[providers.curve]
enabled = true
base_url = "https://prices.curve.fi/v1/usd_price/ethereum"
rpm = 60

[[feeds]]
name = "eth-usd"
quote = "usd"
coingecko_id = "ethereum"
coinmarketcap_symbol = "ETH"
coinpaprika_id = "eth-ethereum"
coinbase_pair = "ETH-USD"

